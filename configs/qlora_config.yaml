# QLoRA configuration used in the project

model:
  name: "meta-llama/Llama-3.2-1B-Instruct"

quantization:
  load_in_4bit: true
  quantization_type: "nf4"
  double_quantization: true
  compute_dtype: "float16"

lora:
  target_modules:
    - "q_proj"
    - "v_proj"
  r: 8
  alpha: 16
  dropout: 0.05

training:
  epochs: 3
  learning_rate: 0.0002
  batch_size: 1
  gradient_accumulation_steps: 4
  max_sequence_length: 384
  seed: 42

generation:
  max_new_tokens: 128
  num_beams: 4

training_dataset_sizes:
  - 1000
  - 2000
  - 5000
  - 10000
